<div id="card">
    <div id="inside" [style.background-color]="backgroundColor()">
        <header>
            <div class="left">
                <div class="name">{{monster().name}}</div>
            </div> 
            <div class="right">
                <div class="HP">{{monster().hp}}</div>
                <img class="energy icon" [src]="monsterTypeIcon()">
            </div>
        </header>
        <figure id="art">
            <img [src]="monster().image">
            <figcaption>{{monster().figureCaption}}</figcaption>
        </figure>
        <div id="Capacities">
            <div class="capacity">
                <div class="main">
                    <div class="cost">
                        <img class="icon Energy" [src]="monsterTypeIcon()">
                        <img class="icon Energy" [src]="monsterTypeIcon()">
                    </div>
                    <div class="name">{{monster().attackName}}</div>
                    <div class="damage">{{monster().attackDamage}}</div>
                </div>
            </div> 
            <div class="description">{{monster().attackDescription}}</div>
        </div>
    </div>
</div>
